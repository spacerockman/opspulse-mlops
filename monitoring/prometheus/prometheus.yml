global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "target-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["target-app:8001"]
        labels:
          service: "order-service"
          env: "local"

  - job_name: "inference-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inference-api:8002"]
        labels:
          service: "opspulse-inference"
          env: "local"

