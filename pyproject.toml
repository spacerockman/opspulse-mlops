[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opspulse-mlops"
version = "0.1.0"
description = "Enterprise AIOps anomaly detection & automated MLOps/LLMOps platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=16.0.0,<20.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "lightgbm>=4.5.0,<5.0.0",
    "mlflow>=2.16.0,<3.0.0",
    "pandera>=0.20.0,<1.0.0",
    "evidently>=0.4.33,<1.0.0",
    "boto3>=1.35.0,<2.0.0",
]
agent = [
    "langfuse>=2.50.0,<4.0.0",
    "openai>=1.50.0,<2.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["opspulse_core*", "services*", "pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["opspulse_core", "services", "pipelines"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-v"
